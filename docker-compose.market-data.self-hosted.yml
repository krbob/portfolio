x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  portfolio-api:
    environment:
      PORTFOLIO_MARKET_DATA_ENABLED: "true"
      PORTFOLIO_STOCK_ANALYST_API_URL: "http://stock-analyst:8080"
      PORTFOLIO_STOCK_ANALYST_UI_URL: "${PORTFOLIO_STOCK_ANALYST_UI_URL:-http://127.0.0.1:18083}"
      PORTFOLIO_EDO_CALCULATOR_API_URL: "http://edo-calculator:8080"
      PORTFOLIO_BACKUPS_POST_CHANGE_ENABLED: "${PORTFOLIO_BACKUPS_POST_CHANGE_ENABLED:-true}"
      PORTFOLIO_BACKUPS_POST_CHANGE_DEBOUNCE_SECONDS: "${PORTFOLIO_BACKUPS_POST_CHANGE_DEBOUNCE_SECONDS:-120}"
      PORTFOLIO_BACKUPS_POST_CHANGE_MAX_DELAY_SECONDS: "${PORTFOLIO_BACKUPS_POST_CHANGE_MAX_DELAY_SECONDS:-600}"
      PORTFOLIO_BACKUPS_POST_CHANGE_RETENTION_COUNT: "${PORTFOLIO_BACKUPS_POST_CHANGE_RETENTION_COUNT:-10}"
      PORTFOLIO_BACKUPS_SAFETY_RETENTION_DAYS: "${PORTFOLIO_BACKUPS_SAFETY_RETENTION_DAYS:-30}"
    depends_on:
      stock-analyst:
        condition: service_healthy
      edo-calculator:
        condition: service_started
    logging: *default-logging

  stock-analyst:
    image: ghcr.io/krbob/stock-analyst@${STOCK_ANALYST_IMAGE_DIGEST:?Set STOCK_ANALYST_IMAGE_DIGEST to sha256:<64 hex>}
    depends_on:
      stock-analyst-backend-yfinance:
        condition: service_healthy
    environment:
      BACKEND_URL: "http://stock-analyst-backend-yfinance:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  stock-analyst-backend-yfinance:
    image: ghcr.io/krbob/stock-analyst-backend-yfinance@${STOCK_ANALYST_BACKEND_IMAGE_DIGEST:?Set STOCK_ANALYST_BACKEND_IMAGE_DIGEST to sha256:<64 hex>}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  stock-analyst-ui:
    image: ghcr.io/krbob/stock-analyst-ui@${STOCK_ANALYST_UI_IMAGE_DIGEST:?Set STOCK_ANALYST_UI_IMAGE_DIGEST to sha256:<64 hex>}
    depends_on:
      stock-analyst:
        condition: service_healthy
    environment:
      API_URL: "http://stock-analyst:8080"
      PORTFOLIO_URL: "${PORTFOLIO_PUBLIC_URL:-http://127.0.0.1:4174}"
    ports:
      - "${PORTFOLIO_STOCK_ANALYST_UI_PORT:-18083}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  edo-calculator:
    image: ghcr.io/krbob/edo-calculator@${EDO_CALCULATOR_IMAGE_DIGEST:?Set EDO_CALCULATOR_IMAGE_DIGEST to sha256:<64 hex>}
    logging: *default-logging
    restart: unless-stopped
